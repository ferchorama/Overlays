<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>X Posts — Overlay</title>
  <link rel="preconnect" href="https://use.typekit.net" crossorigin />
  <link rel="stylesheet" href="https://use.typekit.net/mbn6dsd.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Sans+3:wght@400;600;700&family=Work+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Archivo:wght@400;500;600;700&family=Libre+Franklin:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&family=Figtree:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;600;700&family=Lato:wght@400;700&display=swap" />
  <link rel="stylesheet" href="style.css?v=1.0.1" />
</head>
<body>
  <div class="stage" id="stage">
    <!-- the empire-state plate: the same slowly drifting background the
         prediction board carries, so the suite reads as one set -->
    <div class="bd" id="bd" aria-hidden="true">
      <div class="bd__img" id="bdImg"></div>
      <div class="bd__tint" id="bdTint"></div>
    </div>

    <div class="board" id="board">
      <header class="board__header">
        <div class="brand">
          <img class="brand__logo" id="logo" src="assets/rollup-logo.png" alt="The Rollup" />
        </div>
        <div class="brand__titles">
          <div class="kicker" id="kicker">Live from New York</div>
          <h1 class="headline" id="headline">X Posts</h1>
        </div>
        <div class="header-right" id="headerRight">
          <div id="rightTop">In the feed</div>
          <span id="rightSub"></span>
        </div>
      </header>

      <main class="board__main">
        <section class="hero" id="hero">
          <div class="hero__body" id="heroBody"></div>
        </section>

      </main>
    </div>

    <div class="nav" id="nav">
      <button class="nav__btn" id="prev" type="button" aria-label="Previous post">‹</button>
      <div class="nav__count" id="navCount"></div>
      <button class="nav__btn" id="next" type="button" aria-label="Next post">›</button>
    </div>
  </div>

  <script src="vendor/gsap.min.js?v=1.0.0"></script>
  <script src="config.js?v=1.0.0"></script>
  <script src="script.js?v=1.7.1"></script>
</body>
</html>
